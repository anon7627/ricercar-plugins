# Static Linux builds (x86_64, aarch64); elsewhere, build it from the repository
# (`cargo install --git https://github.com/anon7627/tidalsrc`).
id = "tidal"
name = "TIDAL (unofficial)"
description = "Browse and search TIDAL and your library, and stream it lossless or hi-res at the best quality your DAC plays natively, original FLAC frames unchanged. Mixes, lyrics, radio, artist and album details, your own playlists editable. Sign in with a code (CD quality) or through the TIDAL page (hi-res). Unofficial, uses the TIDAL API; needs a TIDAL subscription."
author = "anon7627"
license = "MIT"
repository = "https://github.com/anon7627/tidalsrc"
version = "0.1.0"
protocol = 1
capabilities = ["auth", "browse", "search", "resolve", "favorites", "library", "lyrics", "playlist_edit", "details", "radio"]
args = ["plugin"]

