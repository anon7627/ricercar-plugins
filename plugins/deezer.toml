# Static Linux builds (x86_64, aarch64); elsewhere, build it from the repository
# (`cargo install --git https://github.com/anon7627/deezsrc`).
id = "deezer"
name = "Deezer (unofficial)"
description = "Browse and search Deezer and your library, Flow and mixes included, and stream it in FLAC (HiFi plan) or MP3, original codec unchanged, with seeking. Lyrics, radio, artist and album details, your own playlists editable. Sign in with your browser's arl cookie. Unofficial, uses Deezer's private API; needs a Deezer subscription."
author = "anon7627"
license = "MIT"
repository = "https://github.com/anon7627/deezsrc"
version = "0.1.0"
protocol = 1
capabilities = ["auth", "browse", "search", "resolve", "favorites", "reporting", "library", "lyrics", "playlist_edit", "details", "radio"]
args = ["plugin"]

