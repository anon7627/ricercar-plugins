# Unofficial Qobuz client. Static Linux builds (x86_64, aarch64); elsewhere,
# build it from the repository (`cargo install --git https://github.com/anon7627/ricercar-qconnect`).
id = "qobuz"
name = "Qobuz (unofficial)"
description = "Browse and search your Qobuz library, and stream it at the best quality your DAC plays natively. Lyrics, radio and continuous playback, artist and album details, your own playlists editable. Qobuz Connect support: pick your player from the Qobuz app and control it from your phone. Unofficial, uses the Qobuz web API; needs a Qobuz subscription."
author = "anon7627"
license = "MIT"
repository = "https://github.com/anon7627/ricercar-qconnect"
version = "0.2.0"
protocol = 1
capabilities = ["auth", "browse", "search", "resolve", "favorites", "reporting", "remote_control", "library", "lyrics", "playlist_edit", "details", "radio"]
args = ["plugin"]

