# Unofficial Qobuz client. Static Linux x86_64 build; elsewhere, build it
# from the repository (`cargo install --git https://github.com/anon7627/ricercar-qconnect`).
id = "qobuz"
name = "Qobuz (unofficial)"
description = "Browse and search your Qobuz library, and stream it at the best quality your DAC plays natively. Qobuz Connect support: pick your player from the Qobuz app and control it from your phone. Unofficial, uses the Qobuz web API; needs a Qobuz subscription."
author = "anon7627"
license = "MIT"
repository = "https://github.com/anon7627/ricercar-qconnect"
version = "0.1.3"
protocol = 1
capabilities = ["auth", "browse", "search", "resolve", "favorites", "remote_control", "library"]
args = ["plugin"]

[[assets]]
arch = "x86_64"
url = "https://github.com/anon7627/ricercar-qconnect/releases/download/v0.1.3/qconnect-x86_64"
sha256 = "046b830392aa82330636dd9db2f0ca17442518397a919dc0e869c700e212a8f6"
