name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Entries are valid and generated files are up to date
        run: python3 scripts/build.py --check
